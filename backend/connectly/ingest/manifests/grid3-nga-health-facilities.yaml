# GRID3 NGA Health Facilities. Download by hand from the GRID3 Data Hub.
# v3.0 (August 2026) covers 24 states; v2.0 (November 2024) covers all 37. Adamawa is in both.
key: grid3-nga-health-facilities
kind: facilities
source:
  key: grid3
  name: GRID3 (Geo-Referenced Infrastructure and Demographic Data for Development)
  url: https://grid3.org/geospatial-data-nigeria
title: GRID3 NGA - Health Facilities
version: "v3.0 (Aug 2026) or v2.0 (Nov 2024) — record the version you downloaded here"
geographic_coverage: Nigeria (v3.0 24 states; v2.0 all states)
method_summary: Geolocated health facilities compiled by GRID3 with federal and state partners.
limitations: >-
  Facility existence and type as published; functional status where given. Column names
  must be confirmed against the downloaded file; the loader lists the real columns if
  none of the candidates match.
licence: "GRID3 open data licence — confirm on the dataset page"
licence_verified: false
commercial_use_allowed: null
attribution: "Health facilities © GRID3."
landing_url: https://data.grid3.org/search?q=Nigeria%20health%20facilities
download:
  mode: manual
  instructions: >-
    On data.grid3.org open "GRID3 NGA - Health Facilities v3.0" (or v2.0 for Taraba and
    Plateau), choose Download → GeoJSON or CSV, save it under data/manual/, then run:
    connectly ingest load grid3-nga-health-facilities --file data/manual/<file> --within-state Adamawa
points:
  target: facility
  facility_kind: health
  lon: [longitude, Longitude, LONGITUDE, x, X, lon]
  lat: [latitude, Latitude, LATITUDE, y, Y, lat]
fields:
  name: [facility_name, primary_name, name, Name, facility_n]
  code: [globalid, GlobalID, global_id, facility_id, uniq_id, OBJECTID, objectid, FID]
  subtype: [type, facility_type, category, facility_level, ftype]
  status: [functional_status, functional, status, operational_status]
  ownership: [ownership, ownership_type, owner]
