method_summary: >-
  GRID3 Nigeria LGA boundaries as republished by geoBoundaries. The file has no state
  attribute; Connectly assigns each LGA to the state it overlaps most and records the
  overlap share.
limitations: >-
  Operational boundaries for planning and analysis, not legal survey boundaries.
  Reflects the GRID3 update of February 2023. GRID3's own site lists a later
  "Operational LGA Boundaries" product; switch to it by loading it as a new dataset.
  LGA names repeat across states (for example Bassa, Irepodun, Nasarawa, Obi, Surulere),
  so LGAs must always be identified with their state.
