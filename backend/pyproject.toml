[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectly-intelligence"
version = "0.1.0"
description = "Connectly Intelligence backend: community intelligence database, ingestion pipelines and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
connectly = "connectly.cli:app"

[tool.setuptools.packages.find]
include = ["connectly*"]

[tool.setuptools.package-data]
"connectly.ingest" = ["manifests/*.yaml", "templates/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: checks against real datasets loaded into the development database (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Reference text and SQL strings read better unwrapped.
"connectly/taxonomy/seed_data.py" = ["E501"]
"connectly/ingest/derive.py" = ["E501"]
"tests/**" = ["E501", "F811"]
"connectly/services/**" = ["E501"]
"connectly/api/routers/**" = ["E501"]
"connectly/ai/**" = ["E501"]
"connectly/services/market_entry.py" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["connectly", "tests"]
