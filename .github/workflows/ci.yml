# Runs on every push and pull request. Uses only free GitHub-hosted runners.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: connectly
          POSTGRES_PASSWORD: connectly
          POSTGRES_DB: connectly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connectly" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CONNECTLY_TEST_DATABASE_URL: postgresql+psycopg://connectly:connectly@localhost:5432/connectly_test
      # No development database in CI, so the real-data checks skip themselves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Check for known vulnerabilities in dependencies
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  # Independent check of the Docker setup: build both images, start the full stack, load the
  # real boundary data, create an admin, and run the browser tests against it.
  stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          echo "CONNECTLY_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" >> .env
          echo "POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')" >> .env
      - name: Build and start
        run: docker compose --profile app up -d --build --wait --wait-timeout 300
      - name: API is not published to the host
        run: "! curl -sf http://localhost:8000/health"
      - name: Load real boundary data
        run: docker compose exec -T api connectly bootstrap
      - name: Create an admin account
        run: |
          OUT=$(docker compose exec -T api connectly users create --email e2e.admin@example.org --name "E2E Admin" --role admin)
          echo "$OUT" | head -1
          echo "E2E_TEMP_PASSWORD=$(echo "$OUT" | sed -n 's/.*first sign-in): //p')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser tests
        working-directory: frontend
        env:
          E2E_EMAIL: e2e.admin@example.org
          E2E_NEW_PASSWORD: ci-e2e-passphrase-${{ github.run_id }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs
        if: failure()
        run: docker compose --profile app logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
