# Runs on every push and pull request. Uses only free GitHub-hosted runners.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: connectly
          POSTGRES_PASSWORD: connectly
          POSTGRES_DB: connectly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connectly" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CONNECTLY_TEST_DATABASE_URL: postgresql+psycopg://connectly:connectly@localhost:5432/connectly_test
      # No development database in CI, so the real-data checks skip themselves.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
